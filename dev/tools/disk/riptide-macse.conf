# riptide.conf for Riptide on the Mac (RiptidePrefs edits it).
# Both network functions of the Aurora68 card: the wired port (en0, used first while its cable is
# in) and the WiFi (en1, taken over when the wired link drops). DHCP on each. This Mac is MacSE
# (MacSE.local by mDNS); 1.1.1.1 is asked first for names, the DHCP servers' name servers after it.
interface en0 device=.ENET card=ethernet
interface en1 device=.ENET card=wifi
hostname MacSE
nameserver 1.1.1.1
dhcp en0
dhcp en1
