# riptide.conf for Riptide on the Mac (RiptidePrefs edits it).
# DHCP on the Ethernet card; this Mac is MacSE (MacSE.local by mDNS); 1.1.1.1 is asked first for names
# (a name server the DHCP lease names is added after it, as a fallback).
interface en0 device=.ENET unit=0
hostname MacSE
nameserver 1.1.1.1
dhcp en0
