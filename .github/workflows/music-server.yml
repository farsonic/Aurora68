# SPDX-License-Identifier: MPL-2.0
# The music server (tools/music-server): its test, then its Docker image for amd64, arm64 and 32-bit ARM
# NAS boxes, published as ghcr.io/farsonic/aurora68-music-server (latest, and the commit). Since 22 November 2026 (music
# videos) the test and an image build run on every branch that touches these paths; the image is published from main only.
name: music server
on:
  push:
    paths: ['tools/music-server/**', 'play/core/**', '.github/workflows/music-server.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python3 tools/music-server/test_server.py
      - name: The image's ffmpeg (ffprobe, x264, AAC, MPEG-1 and MP2 for the videos)
        run: |
          docker build -t music-check tools/music-server
          docker run --rm --entrypoint sh music-check -c 'ffprobe -version | head -1 && for e in libx264 aac mpeg1video mp2 libmp3lame; do ffmpeg -hide_banner -encoders | grep -q " $e " || { echo "no $e encoder"; exit 1; }; echo "$e: yes"; done'
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tools/music-server
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/farsonic/aurora68-music-server:latest
            ghcr.io/farsonic/aurora68-music-server:${{ github.sha }}
