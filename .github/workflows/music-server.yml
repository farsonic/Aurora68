# SPDX-License-Identifier: MPL-2.0
# The music server (tools/music-server): its test, then its Docker image for amd64, arm64 and 32-bit ARM
# NAS boxes, published as ghcr.io/farsonic/aurora68-music-server (latest, and the commit).
name: music server
on:
  push:
    branches: [main]
    paths: ['tools/music-server/**', 'mac/piplay/icy.*', 'mac/piplay/stations.*', '.github/workflows/music-server.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python3 tools/music-server/test_server.py
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: tools/music-server
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/farsonic/aurora68-music-server:latest
            ghcr.io/farsonic/aurora68-music-server:${{ github.sha }}
